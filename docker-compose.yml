# One-command Postgres + forenix-oss for self-hosting.
#
#   docker compose up -d --build
#   docker compose exec app bunx prisma db push --schema=prisma/schema.postgres.prisma
#   docker compose exec app bun run db:seed:pg
#   open http://localhost:3000
#
# Override secrets via .env in the project root (compose reads it
# automatically) or via `env_file` below.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: forenix
      POSTGRES_USER: forenix
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-forenix-local-dev}"
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forenix -d forenix"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://forenix:${POSTGRES_PASSWORD:-forenix-local-dev}@postgres:5432/forenix?sslmode=disable"
      AUTH_SECRET:       "${AUTH_SECRET:?set AUTH_SECRET (openssl rand -base64 32)}"
      NEXTAUTH_SECRET:   "${AUTH_SECRET:?set AUTH_SECRET (openssl rand -base64 32)}"
      NEXTAUTH_URL:      "${NEXTAUTH_URL:-http://localhost:3000}"
      AUTH_TRUST_HOST:   "true"
      AI_ADAPTER:        "${AI_ADAPTER:-mock}"
      GROQ_API_KEY:      "${GROQ_API_KEY:-}"
      GROQ_MODEL:        "${GROQ_MODEL:-llama-3.3-70b-versatile}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_MODEL:   "${OPENROUTER_MODEL:-openai/gpt-oss-120b:free}"
      NVIDIA_API_KEY:     "${NVIDIA_API_KEY:-}"
      NVIDIA_MODEL:       "${NVIDIA_MODEL:-meta/llama-3.3-70b-instruct}"
      SEED_TOKEN:         "${SEED_TOKEN:-}"
    ports:
      - "3000:3000"

volumes:
  pg-data:
