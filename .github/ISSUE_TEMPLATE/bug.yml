name: Bug report
description: Something doesn't work the way it should.
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The clearer the repro, the faster the fix.
        For security bugs **please do not file here** — see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A short description of the behaviour you saw.
      placeholder: e.g. "The Audit log returned 500 after clicking Verify chain on a 1000-row dataset."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      placeholder: e.g. "Chain replay completes successfully and returns ok:true."
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.1.0 (from /api/health) or git SHA"
    validations:
      required: true
  - type: dropdown
    id: adapter
    attributes:
      label: Active AI adapter
      options:
        - mock
        - groq
        - openrouter
        - nvidia
        - ollama
        - glm
        - claude
        - other (specify in description)
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database
      options:
        - SQLite (local dev)
        - Postgres (self-host)
        - Postgres (Neon / Vercel)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: dev-server log lines, browser-console errors, anything quoted verbatim
      render: text
