name: Feature request
description: Propose a new feature or a substantive change.
title: "feat: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      placeholder: Lead with the user pain, not the proposed solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      placeholder: Sketch the UX or API. Bullet points are fine.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: What else did you think about? Why is the proposal above better?
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - OSS core (this repo)
        - Vercel demo deployment
        - SaaS premium (out of scope for this repo, but worth tracking)
    validations:
      required: true
