name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: typecheck · lint · prisma · build
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      DATABASE_URL: "file:./dev.db"
      AUTH_SECRET:    "ci-only-secret-not-used-anywhere"
      NEXTAUTH_SECRET: "ci-only-secret-not-used-anywhere"
      NEXTAUTH_URL:   "http://localhost:3000"
      AUTH_TRUST_HOST: "true"
      AI_ADAPTER: "mock"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Cache bun + node modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Prisma generate
        run: bunx prisma generate

      - name: Prisma validate (sqlite default)
        run: bunx prisma validate

      - name: Prisma validate (postgres deploy schema)
        run: bunx prisma validate --schema=prisma/schema.postgres.prisma

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun test
        # Bun's built-in test runner; targets every *.test.ts under src/.

      - name: Apply schema to SQLite
        run: bunx prisma db push --skip-generate

      - name: Seed (smoke)
        run: bun run db:seed

      - name: Build
        run: bun run build
        env:
          # next build needs SOMETHING here even though we don't use it
          DATABASE_URL: "file:./dev.db"
