name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: typecheck · lint · prisma · build
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      DATABASE_URL: "file:./dev.db"
      AUTH_SECRET:    "ci-only-secret-not-used-anywhere"
      NEXTAUTH_SECRET: "ci-only-secret-not-used-anywhere"
      NEXTAUTH_URL:   "http://localhost:3000"
      AUTH_TRUST_HOST: "true"
      AI_ADAPTER: "mock"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Cache bun + node modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Prisma generate
        run: bunx prisma generate

      - name: Prisma validate (sqlite default)
        run: bunx prisma validate

      - name: Prisma validate (postgres deploy schema)
        # The Postgres-flavoured schema reads env("DATABASE_URL"); the
        # job-level value is a sqlite path. Override with a dummy
        # postgres URL just for this step. We don't connect anywhere,
        # we only validate that the schema parses against a Postgres
        # provider.
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?sslmode=disable"
        run: bunx prisma validate --schema=prisma/schema.postgres.prisma

      - name: Prisma schema parity (SQLite vs Postgres)
        # Both schemas ship in the repo (SQLite for dev/tests, Postgres
        # for the droplet deploy). If model declarations drift between
        # them the local + CI typecheck still passes (it runs against
        # SQLite), but the droplet Deploy SaaS workflow fails late at
        # tsc time. This step strips comments + blank lines from the
        # `model` blocks of each file and diffs them. Provider-specific
        # bits (datasource, generator, native type annotations) live
        # outside the model blocks, so they don't trip the diff.
        run: |
          strip() {
            awk '
              /^model / { in_model = 1 }
              in_model {
                sub(/[ \t]*\/\/.*$/, "")
                if (NF == 0) next
                print
                if ($1 == "}") in_model = 0
              }
            ' "$1"
          }
          if ! diff -u <(strip prisma/schema.prisma) <(strip prisma/schema.postgres.prisma); then
            echo ""
            echo "ERROR: Prisma model declarations diverge between schema.prisma"
            echo "(SQLite dev/tests) and schema.postgres.prisma (droplet deploy)."
            echo "Mirror the change to both schemas before merging."
            exit 1
          fi

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun test
        # Bun's built-in test runner; targets every *.test.ts under src/.

      - name: Apply schema to SQLite
        run: bunx prisma db push --skip-generate

      - name: Seed (smoke)
        run: bun run db:seed

      - name: Build
        run: bun run build
        env:
          # next build needs SOMETHING here even though we don't use it
          DATABASE_URL: "file:./dev.db"

  postgres-typecheck:
    name: typecheck · postgres client
    # The `validate` job above generates and typechecks against the
    # SQLite client. That's how v0.5.6 slipped through: a relation
    # present in the SQLite schema but missing from the Postgres schema
    # left the SQLite typecheck green, while the droplet (Postgres
    # client) failed at tsc post-merge. This job regenerates the client
    # from the Postgres deploy schema and typechecks again, so that
    # whole class fails the PR here instead of late on the droplet. It
    # complements the textual schema-parity diff above (which only
    # catches model-block drift); this is the semantic check.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Typecheck only — no connection is made. A dummy Postgres URL is
      # enough for `prisma generate` to emit the Postgres-flavoured client.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?sslmode=disable"
      AUTH_SECRET:     "ci-only-secret-not-used-anywhere"
      NEXTAUTH_SECRET: "ci-only-secret-not-used-anywhere"
      AI_ADAPTER: "mock"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Cache bun + node modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Generate Postgres Prisma client
        run: bunx prisma generate --schema=prisma/schema.postgres.prisma

      - name: Typecheck against the Postgres client
        run: bun run typecheck
