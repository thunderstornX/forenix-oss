name: Deploy SaaS (DigitalOcean)

# Assembles OSS Core (this repo) + the private SaaS overlay
# (thunderstornX/forenix-saas) and rsyncs the result onto the
# DigitalOcean droplet that powers demo.forenix.tech, then
# rebuilds and restarts the systemd service.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#
#   SAAS_REPO_TOKEN      Fine-grained PAT with READ access to
#                        thunderstornX/forenix-saas. Scope:
#                        Repository contents: Read-only.
#                        (Pulls the private overlay at build time.)
#
#   DROPLET_HOST         IP or DNS of the droplet.
#   DROPLET_USER         Deploy user on the droplet (typically "forenix").
#   DROPLET_SSH_KEY      Private SSH key (PEM, including header/footer)
#                        whose public side is in the deploy user's
#                        ~/.ssh/authorized_keys on the droplet.
#   DROPLET_DEPLOY_PATH  Repo path on the droplet (typically "/opt/forenix").
#
# On the droplet, the deploy user needs passwordless sudo for the
# exact systemctl invocation below. Drop this into
# /etc/sudoers.d/forenix-deploy:
#
#   forenix ALL=(root) NOPASSWD: /bin/systemctl restart forenix.service
#
# This workflow runs only AFTER the CI workflow completes successfully
# on main — it no longer races CI on push the way it used to, so a red
# build never reaches the droplet. workflow_dispatch stays available
# for ad-hoc redeploys (a manual droplet fix, or shipping an
# overlay-only change — see RUNBOOK §13).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  # One in-flight deploy at a time; the latest wins. Earlier runs
  # are cancelled rather than queued, since they would just rebuild
  # an older SHA on top of the newer one.
  group: deploy-droplet
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The gate: deploy only when the triggering CI run succeeded (or on
    # a manual dispatch). This is what stops a red build reaching the
    # paid surface — previously deploy ran in parallel with CI.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Check out OSS Core
        uses: actions/checkout@v4
        with:
          path: oss
          fetch-depth: 1
          # On a workflow_run trigger, build the exact commit CI just
          # validated — not whatever main happens to point at now. On
          # manual dispatch head_sha is empty, so fall back to the branch.
          ref: ${{ github.event.workflow_run.head_sha || github.ref_name }}

      - name: Check out SaaS overlay (private)
        uses: actions/checkout@v4
        with:
          repository: thunderstornX/forenix-saas
          token: ${{ secrets.SAAS_REPO_TOKEN }}
          path: overlay
          fetch-depth: 1

      - name: Assemble build tree (OSS + overlay)
        run: |
          # Copy the overlay's `overlay/` tree on top of the OSS tree.
          # Files that exist in both — i.e. view-component stubs OSS
          # ships so its TypeScript build resolves — are replaced by
          # the overlay's full implementation. The contract is that
          # the overlay either ADDs files (new endpoints, new libs)
          # or REPLACES a documented stub (a file in OSS whose top
          # comment explicitly says "overlay overrides this").
          rsync -av overlay/overlay/ oss/
          echo "── assembled tree ──"
          find oss/src/lib/saas -type f | head -20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Pre-flight typecheck (assembled tree · Postgres client)
        # Typecheck the ASSEMBLED tree (OSS Core + private overlay)
        # against the Postgres-flavoured Prisma client — the same client
        # the droplet generates. This catches the v0.5.6 class (and any
        # overlay↔OSS type break) HERE, on the runner, before the rsync
        # touches the droplet. Typecheck only; no DB connection is made.
        working-directory: oss
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?sslmode=disable"
        run: |
          bun install --frozen-lockfile
          bunx prisma generate --schema=prisma/schema.postgres.prisma
          bun run typecheck

      - name: Stamp deploy revision
        # Record the exact OSS commit + build time so the running
        # service can report the truth via /api/health. rsync carries
        # this file to the droplet (not excluded); the on-droplet .git
        # is excluded and must never be trusted for "what's running".
        working-directory: oss
        run: |
          SHA="$(git rev-parse HEAD)"
          printf '{"commit":"%s","builtAt":"%s"}\n' \
            "$SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .revision
          echo "stamped: $(cat .revision)"

      - name: Configure SSH agent for the droplet
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_KEY }}

      - name: Trust the droplet's host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync assembled tree to the droplet
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='*.db' \
            --exclude='dev.db*' \
            --exclude='.attestation-keys' \
            --exclude='_argus' \
            --exclude='_forenix' \
            --exclude='private' \
            --exclude='docs/manual_screenshots' \
            oss/ "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}:${{ secrets.DROPLET_DEPLOY_PATH }}/"

      - name: Build + restart on the droplet
        run: |
          ssh "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
            'bash -lc "cd ${{ secrets.DROPLET_DEPLOY_PATH }} && bash scripts/deploy-droplet.sh"'

      - name: Smoke check
        run: |
          # Allow a few seconds for the service to come up before
          # hitting /api/health.
          for i in 1 2 3 4 5; do
            sleep 3
            CODE=$(curl -sk -o /dev/null -w "%{http_code}" "https://demo.forenix.tech/api/health" || echo "000")
            echo "attempt $i → HTTP $CODE"
            if [ "$CODE" = "200" ]; then exit 0; fi
          done
          echo "::error::demo.forenix.tech/api/health did not come back 200"
          exit 1
