<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" width="1600" height="420" role="img" aria-label="forenix/oss — court-admissible OSINT, from the first finding">
  <!--
    Editorial banner for the README.

    Composition reads as a printed document title block:
      ── top accent stripe (one thin oxblood line)
      ── centred wax-seal mark (italic 'f' in a hairline double ring)
      ── serif wordmark "forenix/oss" with the slash italic + oxblood
      ── italic tagline below
      ── bottom hairline double-rule + small-caps colophon line

    All on a warm parchment background. Renders cleanly inline on
    GitHub and at the top of the README on any client.
  -->

  <defs>
    <style>
      .serif       { font-family: "Instrument Serif", "Hoefler Text", "Cambria", "Garamond", serif; font-style: normal; }
      .serif-it    { font-family: "Instrument Serif", "Hoefler Text", "Cambria", "Garamond", serif; font-style: italic; }
      .mono        { font-family: "JetBrains Mono", ui-monospace, monospace; }
      .ink         { fill: #221912; }
      .accent      { fill: #a14a2a; }
      .muted       { fill: #6b574a; }
      .ring        { fill: none; stroke: #a14a2a; }
      .rule        { fill: none; stroke: #c4ad96; }
    </style>
  </defs>

  <!-- parchment field -->
  <rect width="1600" height="420" fill="#f7f0e2"/>

  <!-- top accent stripe -->
  <rect x="0" y="0" width="1600" height="4" fill="#a14a2a"/>

  <!-- micro-inscription, top-right -->
  <text class="mono muted" x="1560" y="34" text-anchor="end" font-size="11" letter-spacing="2.5">VOL. 0 · ED. 4 · v0.4.0 · MIT</text>

  <!-- seal mark, centred -->
  <g transform="translate(800, 145)">
    <circle class="ring" cx="0" cy="0" r="60" stroke-width="1.5"/>
    <circle class="ring" cx="0" cy="0" r="55" stroke-width="0.6"/>
    <text class="serif-it accent" x="0" y="32" text-anchor="middle" font-size="92">f</text>
  </g>

  <!-- wordmark — single line, centred under the seal -->
  <g transform="translate(0, 280)">
    <text class="serif ink" x="800" y="0" text-anchor="middle" font-size="96" letter-spacing="-0.5">
      <tspan>forenix</tspan><tspan class="serif-it accent">/</tspan><tspan>oss</tspan>
    </text>
  </g>

  <!-- tagline -->
  <text class="serif-it muted" x="800" y="335" text-anchor="middle" font-size="24">court-admissible OSINT, from the first finding.</text>

  <!-- bottom double-rule -->
  <line class="rule" x1="540" y1="375" x2="1060" y2="375" stroke-width="1"/>
  <line class="rule" x1="540" y1="382" x2="1060" y2="382" stroke-width="0.5"/>

  <!-- bottom colophon -->
  <text class="mono muted" x="800" y="404" text-anchor="middle" font-size="11" letter-spacing="3">AN  OPEN-SOURCE  INSTRUMENT  OF  EVIDENCE</text>
</svg>
